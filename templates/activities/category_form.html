{% extends 'base.html' %}

{% block title %}Category{% endblock %}

{% block content %}
  <section class="card">
    <h1>Category</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Save</button>
      <a class="btn btn-secondary" href="{% url 'category_list' %}">Cancel</a>
    </form>
  </section>
{% endblock %}
