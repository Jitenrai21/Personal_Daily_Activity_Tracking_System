{% extends 'base.html' %}

{% block title %}Recurrence{% endblock %}

{% block content %}
  <section class="card">
    <h1>Recurrence for {{ activity.title }}</h1>
    <form method="post">
      {% csrf_token %}
      {% include 'partials/form_fields.html' with form=form %}
      <div class="form-actions">
        <button class="btn" type="submit">Save recurrence</button>
        <a class="btn btn-secondary" href="{% url 'activity_detail' activity.pk %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
