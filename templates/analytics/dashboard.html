{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    :root {
      --color-chart-actual-top: #3CB371;
      --color-chart-actual-bottom: #1F6B1F;
      --color-chart-planned-top: #FFD54F;
      --color-chart-planned-bottom: #F0A500;
      --hourly-green-top: #3CB371;
      --hourly-green-bottom: #1F6B1F;
    }

    .dashboard-eyebrow-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.7rem;
      font-size: 0.65rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-color);
      background: var(--surface-soft);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      margin-bottom: 0.6rem;
    }

    .dashboard-title-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .dashboard-title-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 12px;
      background: var(--surface-soft);
      border: 1px solid var(--border-color);
      flex-shrink: 0;
      font-size: 1.35rem;
      color: var(--text-color);
    }

    .section__header .page-title {
      font-size: 1.65rem;
      font-weight: 680;
      line-height: 1.25;
      letter-spacing: -0.015em;
      color: var(--dashboard-ink);
      margin: 0 0 0.2rem;
    }

    .section__header .page-subtitle {
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--accent-color);
      max-width: 30rem;
      margin: 0;
    }

    .dashboard-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
      background: var(--surface-soft);
      padding: 1rem 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: auto;
      margin-left: auto;
    }

    .dashboard-filters .filter-group {
      min-width: 130px;
      flex: 1 1 auto;
    }

    .dashboard-filters .filter-group .field__label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent-color);
      padding-top: 0.55rem;
    }

    .dashboard-filters .filter-group input {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--surface-soft);
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--text-color);
    }

    .dashboard-filters .filter-group input:focus {
      outline: none;
      border-color: var(--cta-color);
      box-shadow: 0 0 0 3px rgba(74, 70, 67, 0.12);
    }

    .dashboard-filter-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
      padding-bottom: 1px;
    }

    @media (max-width: 768px) {
      .dashboard-filters {
        width: 100%;
        margin-left: 0;
      }

      .dashboard-filter-actions {
        width: 100%;
      }

      .dashboard-filter-actions .btn {
        flex: 1;
        justify-content: center;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .dashboard-filters .filter-group {
        min-width: 110px;
        flex: 1 1 28%;
      }
    }

    .hourly-tooltip {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      background: rgba(28, 43, 34, 0.95);
      color: #f2f6f2;
      padding: 8px 11px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.55;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
      max-width: 240px;
    }

    .hourly-tooltip[hidden] {
      display: none;
    }

    .hourly-tooltip strong {
      display: block;
      font-size: 12px;
      margin-bottom: 2px;
      color: #fff;
    }

    .hourly-hint {
      font-size: 0.7rem;
      color: var(--accent-color);
      opacity: 0.8;
      align-self: center;
    }
  </style>
{% endblock %}

{% block content %}
  <section class="section fade-in">
    <header class="section__header">
      <div>
        <span class="dashboard-eyebrow-pill">
          <i class="ti ti-sparkles" aria-hidden="true"></i>
          Insights
        </span>
        <div class="dashboard-title-row">
          <div class="dashboard-title-icon">
            <i class="ti ti-chart-dots-3" aria-hidden="true"></i>
          </div>
          <div>
            <h1 class="page-title">Your momentum snapshot</h1>
            <p class="page-subtitle">Compare category momentum and maintain streaks.</p>
          </div>
        </div>
      </div>
      <form class="dashboard-filters section__actions" method="get" action="{% url 'dashboard' %}"
            hx-get="{% url 'dashboard_partial' %}" hx-target="#dashboard-pane" hx-swap="innerHTML">
        <div class="filter-group field-row field-row--split">
          <label class="field__label" for="from_date">From date</label>
          <input id="from_date" name="from_date" type="date" value="{{ from_date_value }}" max="{{ local_today|date:'Y-m-d' }}">
        </div>
        <div class="filter-group field-row field-row--split">
          <label class="field__label" for="to_date">To date</label>
          <input id="to_date" name="to_date" type="date" value="{{ to_date_value }}" max="{{ local_today|date:'Y-m-d' }}">
        </div>
        <div class="dashboard-filter-actions inline">
          <button class="btn btn--primary btn--md" type="submit">Apply</button>
          <button class="btn btn--secondary btn--md" type="button"
                  data-dashboard-reset
                  data-default-from="{{ from_date_value }}"
                  data-default-to="{{ to_date_value }}">
            Reset
          </button>
        </div>
      </form>
    </header>

    <div id="dashboard-pane" class="stack">
      {% include 'analytics/partials/dashboard_content.html' %}
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js" defer></script>
  <script>
    const chartStore = window.dashboardCharts || (window.dashboardCharts = {});

    function destroyDashboardCharts() {
      Object.keys(chartStore).forEach((id) => {
        if (chartStore[id]) {
          chartStore[id].destroy();
          delete chartStore[id];
        }
      });
    }

    function loadJson(id) {
      const node = document.getElementById(id);
      if (!node) return null;
      return JSON.parse(node.textContent || "null");
    }

    function renderChart(id, config) {
      const canvas = document.getElementById(id);
      if (!canvas) return;
      if (chartStore[id]) chartStore[id].destroy();
      chartStore[id] = new Chart(canvas, config);
    }

    function formatDailyLabel(value) {
      const date = new Date(`${value}T00:00:00`);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    function ensureHourlyTooltip() {
      let tip = document.getElementById("hourlyTooltip");
      if (!tip) {
        tip = document.createElement("div");
        tip.id = "hourlyTooltip";
        tip.className = "hourly-tooltip";
        tip.hidden = true;
        document.body.appendChild(tip);
      }
      return tip;
    }

    function formatHour(h) {
      const hh = Math.floor(h);
      const mm = Math.round((h - hh) * 60);
      return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderHourlyChart() {
      const dayLabels = loadJson("hourly-labels");
      const daysMatrix = loadJson("hourly-days");
      if (!dayLabels || !daysMatrix) return;

      const style = getComputedStyle(document.documentElement);
      const greenTop = style.getPropertyValue("--hourly-green-top").trim() || "#a7e8c4";
      const greenBottom = style.getPropertyValue("--hourly-green-bottom").trim() || "#45b87c";
      const track = style.getPropertyValue("--surface-soft").trim() || "#eef1ee";

      const formattedDayLabels = dayLabels.map((d) => {
        const date = new Date(`${d}T00:00:00`);
        return date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      });

      const activeSegmentsPlugin = {
        id: "activeSegments",
        beforeDraw(chart) {
          const ctx = chart.ctx;
          const xScale = chart.scales.x;
          const area = chart.chartArea;
          if (!area || !xScale) return;
          const bands = [
            [0, 7],
            [23, 24],
          ];
          ctx.save();
          ctx.fillStyle = "rgba(97, 113, 103, 0.07)";
          for (const [from, to] of bands) {
            const x1 = xScale.getPixelForValue(from);
            const x2 = xScale.getPixelForValue(to);
            ctx.fillRect(x1, area.top, x2 - x1, area.bottom - area.top);
          }
          ctx.fillStyle = "#617167";
          const fontFamily = getComputedStyle(document.body).fontFamily || "sans-serif";
          ctx.font = `italic 600 10px ${fontFamily}`;
          ctx.textAlign = "center";
          ctx.textBaseline = "top";
          const mid = (xScale.getPixelForValue(0) + xScale.getPixelForValue(7)) / 2;
          ctx.fillText("Sleep", mid, area.top + 6);
          ctx.restore();
        },
        afterDatasetsDraw(chart) {
          const ctx = chart.ctx;
          const xScale = chart.scales.x;
          const yScale = chart.scales.y;
          const trackMeta = chart.getDatasetMeta(0);
          const numDays = daysMatrix.length;
          const hits = [];
          ctx.save();
          for (let d = 0; d < numDays; d++) {
            const sessions = daysMatrix[d] || [];
            if (!sessions.length) continue;
            const bar = trackMeta.data[d];
            const center = bar && typeof bar.y === "number" ? bar.y : yScale.getPixelForTick(d);
            const rowH = bar && bar.height ? bar.height : (yScale.height / numDays) * 0.7;
            const top = center - rowH / 2 + 2;
            const segH = rowH - 4;
            for (const s of sessions) {
              const x1 = Math.max(xScale.getPixelForValue(s.start), chart.chartArea.left);
              const x2 = Math.min(xScale.getPixelForValue(s.end), chart.chartArea.right);
              const w = Math.max(x2 - x1, 3);
              hits.push({ x: x1, y: top, w: w, h: segH, session: s, dayLabel: formattedDayLabels[d] });
              const grad = ctx.createLinearGradient(x1, 0, x2, 0);
              grad.addColorStop(0, greenTop);
              grad.addColorStop(1, greenBottom);
              ctx.beginPath();
              if (typeof ctx.roundRect === "function") ctx.roundRect(x1, top, w, segH, 3);
              else ctx.rect(x1, top, w, segH);
              ctx.fillStyle = grad;
              ctx.fill();
            }
          }
          ctx.restore();
          chart.$hourlyHits = hits;
        },
      };

      renderChart("hourlyChart", {
        type: "bar",
        data: {
          labels: formattedDayLabels,
          datasets: [{
            label: "Day",
            data: daysMatrix.map(() => [0, 24]),
            backgroundColor: track,
            borderWidth: 0,
            borderRadius: 4,
            borderSkipped: false,
            barPercentage: 0.88,
            categoryPercentage: 0.72,
            maxBarThickness: 24,
          }],
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false },
          },
          scales: {
            x: {
              min: 0,
              max: 24,
              title: { display: true, text: "Hour of day", color: "#617167", font: { size: 11, weight: "600" } },
              grid: { color: "rgba(28, 43, 34, 0.06)", drawBorder: false },
              ticks: { stepSize: 2, color: "#617167", font: { size: 10 }, callback(v) { return `${v}:00`; } },
              border: { display: false },
            },
            y: {
              type: "category",
              labels: formattedDayLabels,
              reverse: true,
              grid: { display: false },
              ticks: { color: "#617167", font: { size: 11 } },
              border: { display: false },
            },
          },
        },
        plugins: [activeSegmentsPlugin],
      });

      const canvas = document.getElementById("hourlyChart");
      if (!canvas || canvas.dataset.hourlyBound) return;
      canvas.dataset.hourlyBound = "1";
      const tip = ensureHourlyTooltip();

      canvas.addEventListener("mousemove", (e) => {
        const chart = chartStore["hourlyChart"];
        if (!chart || !chart.$hourlyHits) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        let hit = null;
        for (const h of chart.$hourlyHits) {
          if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
            hit = h;
            break;
          }
        }
        if (!hit) {
          tip.hidden = true;
          canvas.style.cursor = "default";
          return;
        }
        canvas.style.cursor = "pointer";
        const s = hit.session;
        let html = `<strong>${formatHour(s.start)} – ${formatHour(s.end)}</strong>`;
        html += `<div>${s.minutes} min active</div>`;
        html += `<div>${escapeHtml(s.activity || "Timer session")}</div>`;
        if (s.category) html += `<div>Category: ${escapeHtml(s.category)}</div>`;
        html += `<div>${escapeHtml(hit.dayLabel)}</div>`;
        tip.innerHTML = html;
        tip.hidden = false;
        let left = e.clientX + 14;
        let topPos = e.clientY + 14;
        if (left + tip.offsetWidth > window.innerWidth - 8) left = e.clientX - tip.offsetWidth - 14;
        if (topPos + tip.offsetHeight > window.innerHeight - 8) topPos = e.clientY - tip.offsetHeight - 14;
        tip.style.left = `${left}px`;
        tip.style.top = `${topPos}px`;
      });

      canvas.addEventListener("mouseleave", () => {
        tip.hidden = true;
        canvas.style.cursor = "default";
      });
    }

    function renderDashboardCharts() {
      destroyDashboardCharts();

      renderHourlyChart();

      const categorySeries = loadJson("category-daily-series");
      if (!categorySeries) return;

      const style = getComputedStyle(document.documentElement);
      const chartPalette = {
        actual:  { top: style.getPropertyValue('--color-chart-actual-top').trim() || "#3CB371", bottom: style.getPropertyValue('--color-chart-actual-bottom').trim() || "#1F6B1F" },
        planned: { top: style.getPropertyValue('--color-chart-planned-top').trim() || "#FFD54F", bottom: style.getPropertyValue('--color-chart-planned-bottom').trim() || "#F0A500" },
      };

      function makeBarGradient(ctx, chartArea, colors) {
        if (!chartArea) return colors.bottom;
        const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
        gradient.addColorStop(0, colors.top);
        gradient.addColorStop(1, colors.bottom);
        return gradient;
      }

      categorySeries.forEach((series) => {
        const formattedDailyLabels = series.labels.map(formatDailyLabel);
        renderChart(`dailyChart-${series.key}`, {
          type: "bar",
          data: {
            labels: formattedDailyLabels,
            datasets: [
              {
                label: "Actual",
                data: series.actual,
                backgroundColor: (context) => makeBarGradient(context.chart.ctx, context.chart.chartArea, chartPalette.actual),
                borderRadius: 4,
                categoryPercentage: 0.72,
                barPercentage: 0.88,
                maxBarThickness: 24,
              },
              {
                label: "Planned",
                data: series.planned,
                backgroundColor: (context) => makeBarGradient(context.chart.ctx, context.chart.chartArea, chartPalette.planned),
                borderRadius: 4,
                categoryPercentage: 0.72,
                barPercentage: 0.88,
                maxBarThickness: 24,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { intersect: false, mode: "index" },
            plugins: {
              legend: {
                display: true,
                position: "top",
                align: "end",
                labels: {
                  boxWidth: 12,
                  boxHeight: 12,
                  padding: 15,
                  font: { size: 11, weight: "600" },
                  color: "#617167",
                  usePointStyle: true,
                  pointStyle: "circle",
                  generateLabels(chart) {
                    const legendColors = [chartPalette.actual.bottom, chartPalette.planned.bottom];
                    return chart.data.datasets.map((dataset, i) => ({
                      text: dataset.label,
                      fillStyle: legendColors[i],
                      strokeStyle: legendColors[i],
                      pointStyle: "circle",
                      datasetIndex: i,
                    }));
                  },
                },
              },
              tooltip: {
                backgroundColor: "rgba(28, 43, 34, 0.95)",
                padding: 12,
                cornerRadius: 6,
                titleFont: { size: 12, weight: "600" },
                bodyFont: { size: 11 },
                displayColors: true,
                boxWidth: 8,
                boxHeight: 8,
                boxPadding: 4,
                callbacks: {
                  title(tooltipItems) {
                    if (!tooltipItems.length) return series.name;
                    return `${series.name} • ${tooltipItems[0].label}`;
                  },
                  label(context) {
                    const label = context.dataset.label || "Value";
                    const value = context.formattedValue || 0;
                    return `${label}: ${value} min`;
                  },
                  afterBody(tooltipItems) {
                    if (!tooltipItems.length) return [];
                    const dataIndex = tooltipItems[0].dataIndex;
                    const breakdown = (series.activity_breakdown && series.activity_breakdown[dataIndex]) || [];
                    if (!breakdown.length) return ["Activity breakdown: none available"];
                    const lines = ["Activity breakdown:"];
                    breakdown.slice(0, 6).forEach((item) => {
                      const parts = [];
                      if (item.actual)      parts.push(`actual ${item.actual} min`);
                      if (item.planned)     parts.push(`planned ${item.planned} min`);
                      if (item.description) parts.push(item.description);
                      lines.push(`${item.name}: ${parts.join(" • ")}`);
                    });
                    if (breakdown.length > 6) lines.push(`+ ${breakdown.length - 6} more activities`);
                    return lines;
                  },
                },
              },
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: {
                  autoSkip: true,
                  maxTicksLimit: 8,
                  maxRotation: 0,
                  minRotation: 0,
                  color: "#617167",
                  font: { size: 11 },
                },
                border: { color: "rgba(28, 43, 34, 0.1)" },
              },
              y: {
                beginAtZero: true,
                grid: { color: "rgba(28, 43, 34, 0.06)", drawBorder: false },
                ticks: { color: "#617167", font: { size: 11 }, precision: 0 },
                border: { display: false },
              },
            },
          },
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderDashboardCharts();
    });

    document.body.addEventListener("htmx:afterSwap", (event) => {
      if (event.target && event.target.id === "dashboard-pane") {
        window.requestAnimationFrame(() => { renderDashboardCharts(); });
      }
    });

    document.body.addEventListener("htmx:beforeSwap", (event) => {
      if (event.target && event.target.id === "dashboard-pane") {
        destroyDashboardCharts();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const filterForm = document.querySelector(".dashboard-filters");
      if (filterForm) {
        const resetButton = filterForm.querySelector("[data-dashboard-reset]");
        if (resetButton) {
          resetButton.addEventListener("click", () => {
            const fromField = filterForm.querySelector("#from_date");
            const toField   = filterForm.querySelector("#to_date");
            if (fromField) fromField.value = resetButton.dataset.defaultFrom || "";
            if (toField)   toField.value   = resetButton.dataset.defaultTo   || "";
            filterForm.requestSubmit();
          });
        }
      }
    });

    document.body.addEventListener("click", (event) => {
      const btn = event.target.closest(".year-btn");
      if (!btn || btn.dataset.hourlyWeek !== undefined) return;
      const year = btn.dataset.year;
      const params = new URLSearchParams(window.location.search);
      params.set("heatmap_year", year);
      htmx.ajax("GET", `{% url 'dashboard_partial' %}?${params.toString()}`, { target: "#dashboard-pane", swap: "innerHTML" });
    });

    document.body.addEventListener("click", (event) => {
      const btn = event.target.closest("[data-hourly-week]");
      if (!btn || btn.disabled) return;
      const value = btn.dataset.hourlyWeek;
      const params = new URLSearchParams(window.location.search);
      if (value === "latest") params.delete("hourly_week");
      else params.set("hourly_week", value);
      htmx.ajax("GET", `{% url 'dashboard_partial' %}?${params.toString()}`, { target: "#dashboard-pane", swap: "innerHTML" });
    });
  </script>
{% endblock %}
