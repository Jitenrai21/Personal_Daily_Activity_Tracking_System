{% extends 'base.html' %}

{% block title %}Log in{% endblock %}

{% block content %}
  <section class="card">
    <h1>Log in</h1>
    <form method="post">
      {% csrf_token %}
      {% include 'partials/form_fields.html' with form=form %}
      <div class="form-actions">
        <button class="btn" type="submit">Log in</button>
      </div>
    </form>
    <div class="muted">
      <a href="{% url 'password_reset' %}">Forgot password?</a>
    </div>
  </section>
{% endblock %}
