{% extends 'base.html' %}

{% block title %}Change password{% endblock %}

{% block content %}
  <section class="card">
    <h1>Change password</h1>
    <form method="post">
      {% csrf_token %}
      {% include 'partials/form_fields.html' with form=form %}
      <div class="form-actions">
        <button class="btn" type="submit">Update password</button>
      </div>
    </form>
  </section>
{% endblock %}
