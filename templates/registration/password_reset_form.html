{% extends 'base.html' %}

{% block title %}Reset password{% endblock %}

{% block content %}
  <section class="card">
    <h1>Reset password</h1>
    <p class="muted">Enter your email and we will send a reset link.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Send reset link</button>
    </form>
  </section>
{% endblock %}
