{% extends 'base.html' %}

{% block title %}Sign up{% endblock %}

{% block content %}
  <section class="card">
    <h1>Create account</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Create account</button>
    </form>
    <div class="muted">
      Already have an account? <a href="{% url 'login' %}">Log in</a>
    </div>
  </section>
{% endblock %}
